<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>OrbitDeck</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="sky"></canvas>
<canvas id="viz"></canvas>
<div id="lyrics"></div>
<aside id="deck" class="hit" aria-label="Player">
  <div class="ctrls">
    <button class="ib" id="folder" title="Pilih folder musik"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
    <button class="ib" id="shuf" title="Acak"><svg viewBox="0 0 24 24"><path d="M3 7h3c4 0 5 10 9 10h5M3 17h3c1.4 0 2.5-1.2 3.5-2.8M13 9c.8-1.2 1.8-2 3-2h4M17 4l3 3-3 3M17 14l3 3-3 3"/></svg></button>
    <button class="ib" id="loop" title="Ulangi lagu"><svg viewBox="0 0 24 24"><path d="M17 3l3 3-3 3M4 11V9a3 3 0 0 1 3-3h13M7 21l-3-3 3-3M20 13v2a3 3 0 0 1-3 3H4"/></svg></button>
    <button class="ib" id="sysb" title="Mode Spotify / audio PC"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2"/></svg></button>
    <span class="sp"></span>
    <button class="ib f" id="prev" title="Sebelumnya"><svg viewBox="0 0 24 24"><path d="M18 6l-8 6 8 6zM6 6h2v12H6z"/></svg></button>
    <button class="ib f" id="play" title="Putar"><svg viewBox="0 0 24 24"><path id="pp" d="M8 5v14l11-7z"/></svg></button>
    <button class="ib f" id="next" title="Berikutnya"><svg viewBox="0 0 24 24"><path d="M6 6l8 6-8 6zM16 6h2v12h-2z"/></svg></button>
    <span class="sp"></span>
    <button class="ib" id="quit" title="Tutup OrbitDeck"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="now"><img id="nowimg" alt=""><div><span id="ttl"></span><span id="art"></span></div></div>
  <div id="seek"><div class="bar" id="bar"><i id="fill"></i></div><div class="times"><span id="tcur">0:00</span><span id="tend"></span></div></div>
  <div id="syncrow" hidden><span>Geser lirik</span><button class="ib" id="lm" title="Lirik lebih cepat">−</button><b id="off">0.0s</b><button class="ib" id="lp" title="Lirik lebih lambat">+</button></div>
  <ul id="list"></ul>
  <p class="hint" id="hint"></p>
</aside>
<script src="app.js"></script>
</body>
</html>
